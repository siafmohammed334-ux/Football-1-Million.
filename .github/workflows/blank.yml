
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: football-millionaire

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Copy Arabic fonts
        run: |
          mkdir -p www/fonts
          cp node_modules/@fontsource/cairo/files/cairo-arabic-700-normal.woff2 www/fonts/
          cp node_modules/@fontsource/cairo/files/cairo-arabic-900-normal.woff2 www/fonts/

      - name: Refresh questions
        run: node scripts/build-questions.js

      - name: Create splash image
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          icon = Image.open("assets/icon.png").convert("RGB").resize((1100, 1100))
          bg = Image.new("RGB", (2732, 2732), (3, 8, 24))
          bg.paste(icon, ((2732-1100)//2, (2732-1100)//2))
          bg.save("assets/splash.png")
          bg.save("assets/splash-dark.png")
          PY

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons
        run: npx capacitor-assets generate --android --iconBackgroundColor "#030818" --splashBackgroundColor "#030818"

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: football-millionaire-apk
          path: football-millionaire/android/app/build/outputs/apk/debug/app-debug.apk
